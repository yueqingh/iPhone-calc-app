<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="计算器">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f1115">
<meta name="app-version" content="1.2.0">
<title>计算器</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1115; --fg:#f2f4f8; --muted:#8b93a3; --line:#2a303b;
  --key:#1d2129; --key-fn:#2e3440; --key-op:#3a4560; --accent:#ffb547; --accent-fg:#1a1200;
  --accent2:#6cc7f0; --accent2-fg:#05202b; --danger:#ff6b6b; --sheet:#171a21;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eceff4; --fg:#12151b; --muted:#667085; --line:#d5dae3;
    --key:#ffffff; --key-fn:#dde2ea; --key-op:#cfd8ea; --accent:#f59e0b; --accent-fg:#1a1200;
    --accent2:#1b8fc4; --accent2-fg:#ffffff; --danger:#d92d20; --sheet:#ffffff;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
[hidden]{display:none !important}

.app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(env(safe-area-inset-top),8px) 16px max(env(safe-area-inset-bottom),12px);
}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.bar-btn{
  min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);
  background:var(--key-fn);color:var(--fg);font-size:15px;white-space:nowrap
}
.bar-btn.diag{background:var(--accent2);color:var(--accent2-fg);border-color:transparent;font-weight:600}
.bar-left{display:flex;gap:8px}
.ver{position:absolute;left:4px;top:4px;font-size:12px;color:var(--muted)}

.display{
  position:relative;flex:1;min-height:96px;display:flex;flex-direction:column;overflow:hidden;
  justify-content:flex-end;align-items:flex-end;padding:22px 4px 10px;min-width:0
}
.sub{
  min-height:24px;font-size:18px;color:var(--muted);max-width:100%;text-align:right;white-space:normal;
  overflow-wrap:anywhere;-webkit-user-select:text;user-select:text
}
.sub.err{color:var(--danger)}
.main{
  max-width:100%;font-size:64px;font-weight:300;line-height:1.15;text-align:right;white-space:normal;
  overflow-wrap:normal;overflow-x:hidden;overflow-y:hidden;font-variant-numeric:tabular-nums;
  -webkit-user-select:text;user-select:text
}
.main.crush{overflow-wrap:anywhere}

.keys{
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr);gap:10px;
  height:min(64vh,140vw);height:min(64dvh,140vw)
}
.key{
  border:0;border-radius:18px;font-size:clamp(22px,6.4vw,30px);background:var(--key);color:var(--fg);
  transition:transform .06s,filter .06s;min-width:0
}
.key:active{transform:scale(.96);filter:brightness(1.3)}
.key.fn{background:var(--key-fn)}
.key.op{background:var(--key-op)}
.key.eq{background:var(--accent);color:var(--accent-fg);font-weight:600;grid-column:1 / -1}
.key svg{width:1.1em;height:1.1em;vertical-align:middle}

.backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:10}
.sheet{
  position:fixed;left:0;right:0;bottom:0;height:78vh;height:78dvh;max-width:480px;margin:0 auto;z-index:11;
  background:var(--sheet);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -8px 30px rgba(0,0,0,.35)
}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .18s ease-out}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-list{flex:1;margin:0;padding:0;list-style:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.h-li{border-bottom:1px solid var(--line);padding:4px 18px 0}
.h-top{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.h-nb{min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--key-fn);color:var(--fg);font-size:13px}
.h-note{text-align:right;color:var(--accent2);font-size:15px;word-break:break-all;padding:0 0 4px}
.h-item{display:block;width:100%;text-align:right;background:none;border:0;color:var(--fg);padding:4px 0 12px}
.h-item:active{background:var(--key-fn)}
.h-t{font-size:12px;color:var(--muted)}
.h-search{padding:8px 14px;border-bottom:1px solid var(--line)}
.h-search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 14px;font-size:16px}
.notebar{margin-top:6px;max-width:100%}
.note-btn{min-height:34px;max-width:100%;padding:0 12px;border-radius:17px;border:1px dashed var(--accent2);background:transparent;color:var(--accent2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-btn.has{border-style:solid;background:var(--key-fn);color:var(--fg)}
.backdrop.nb{z-index:24}
.notedlg{
  position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 64px);max-width:456px;margin:0 auto;z-index:25;
  background:var(--sheet);color:var(--fg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 10px 40px rgba(0,0,0,.45)
}
.nd-ctx{font-size:14px;color:var(--muted);word-break:break-all;line-height:1.4}
.notedlg input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font-size:17px}
.nd-count{font-size:12px;color:var(--muted);text-align:right;margin-top:-4px}
.nd-count.over{color:var(--danger)}
.nd-row{display:flex;gap:8px;align-items:center}
.nd-row .grow{flex:1}
.h-e{display:block;font-size:15px;color:var(--muted);word-break:break-all}
.h-r{display:block;font-size:28px;font-weight:300;word-break:break-all}
.h-empty{padding:40px 16px;text-align:center;color:var(--muted)}
.sheet.sheet-sm{height:auto;max-height:80dvh}
.set-body{padding:6px 16px 18px;overflow-y:auto}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.set-t{font-size:17px}
.set-d{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.set-note{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.5}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--key-fn);position:relative;flex:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--accent2)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

#toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 58px);transform:translateX(-50%);z-index:50;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:15px;max-width:90vw;
  opacity:0;pointer-events:none;transition:opacity .2s;text-align:center
}
#toast.show{opacity:1}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{width:100%;max-width:520px;background:var(--sheet);color:var(--fg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;max-height:90dvh}
.modal-box p{margin:0;font-size:15px;line-height:1.5}
.modal-box textarea{width:100%;height:40vh;height:40dvh;font-size:12px;font-family:ui-monospace,Menlo,monospace;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px}
.modal-row{display:flex;gap:10px;justify-content:flex-end}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="bar-left">
      <button type="button" class="bar-btn" id="btnHistory">历史</button>
      <button type="button" class="bar-btn" id="btnSettings">设置</button>
    </div>
    <button type="button" class="bar-btn diag" id="btnDiag">复制诊断报告</button>
  </header>

  <main class="display" id="display">
    <span class="ver" id="ver"></span>
    <div class="sub" id="sub"></div>
    <div class="main" id="main">0</div>
    <div class="notebar" id="notebar" hidden><button type="button" class="note-btn" id="btnNote">＋ 备注</button></div>
  </main>

  <section class="keys" id="keys" aria-label="计算器按键">
    <button type="button" class="key fn" data-k="ac" aria-label="全部清除">AC</button>
    <button type="button" class="key fn" data-k="del" aria-label="退格删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9.5l-5 5M12 9.5l5 5"/></svg></button>
    <button type="button" class="key fn" data-k="paren" aria-label="括号">( )</button>
    <button type="button" class="key fn" data-k="%" aria-label="百分号">%</button>

    <button type="button" class="key" data-k="7">7</button>
    <button type="button" class="key" data-k="8">8</button>
    <button type="button" class="key" data-k="9">9</button>
    <button type="button" class="key op" data-k="÷" aria-label="除">÷</button>

    <button type="button" class="key" data-k="4">4</button>
    <button type="button" class="key" data-k="5">5</button>
    <button type="button" class="key" data-k="6">6</button>
    <button type="button" class="key op" data-k="×" aria-label="乘">×</button>

    <button type="button" class="key" data-k="1">1</button>
    <button type="button" class="key" data-k="2">2</button>
    <button type="button" class="key" data-k="3">3</button>
    <button type="button" class="key op" data-k="−" aria-label="减">−</button>

    <button type="button" class="key fn" data-k="neg" aria-label="正负号">±</button>
    <button type="button" class="key" data-k="0">0</button>
    <button type="button" class="key" data-k="." aria-label="小数点">.</button>
    <button type="button" class="key op" data-k="+" aria-label="加">+</button>

    <button type="button" class="key eq" data-k="=" aria-label="等于">=</button>
  </section>
</div>

<div id="backdrop" class="backdrop" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="历史记录" hidden>
  <div class="sheet-head">
    <button type="button" class="bar-btn" id="btnClear">清空</button>
    <strong>历史记录</strong>
    <button type="button" class="bar-btn" id="btnClose">关闭</button>
  </div>
  <div class="h-search"><input id="hSearch" type="search" placeholder="搜索备注、算式或结果" aria-label="搜索历史" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
  <ul class="sheet-list" id="hlist"></ul>
</section>

<div id="noteBackdrop" class="backdrop nb" hidden></div>
<section id="noteDlg" class="notedlg" role="dialog" aria-modal="true" aria-label="备注" hidden>
  <div class="nd-ctx" id="ndCtx"></div>
  <input id="ndInput" type="text" placeholder="写点备注，比如：房租" aria-label="备注内容" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="nd-count" id="ndCount">0/30</div>
  <div class="nd-row">
    <button type="button" class="bar-btn" id="ndDel" hidden>删除备注</button>
    <span class="grow"></span>
    <button type="button" class="bar-btn" id="ndCancel">取消</button>
    <button type="button" class="bar-btn diag" id="ndSave">保存</button>
  </div>
</section>

<section id="setSheet" class="sheet sheet-sm" role="dialog" aria-modal="true" aria-label="设置" hidden>
  <div class="sheet-head">
    <span style="width:64px"></span>
    <strong>设置</strong>
    <button type="button" class="bar-btn" id="btnSetClose">完成</button>
  </div>
  <div class="set-body">
    <div class="set-row">
      <div><div class="set-t">按键音</div><div class="set-d">手机侧面的静音开关拨到静音时没有声音，这是 iPhone 的规定。</div></div>
      <button type="button" role="switch" aria-checked="true" aria-label="按键音" class="switch" id="swSound"></button>
    </div>
    <div class="set-row">
      <div><div class="set-t">按键震动</div><div class="set-d">借用 iPhone 系统自带的轻触反馈，部分系统版本可能没有效果。</div></div>
      <button type="button" role="switch" aria-checked="true" aria-label="按键震动" class="switch" id="swHaptic"></button>
    </div>
    <div class="set-row">
      <div><div class="set-t">导出历史和备注</div><div class="set-d">复制成一段文字，可粘贴到备忘录保存。删掉主屏幕图标或换手机，记录会丢失。</div></div>
      <button type="button" class="bar-btn" id="btnExport">复制</button>
    </div>
    <div class="set-note" id="setInfo"></div>
  </div>
</section>

<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">需要开启 JavaScript 才能使用计算器。</p></noscript>

<!-- ============ 第 1 段脚本：诊断层（独立成段，主程序出错时它仍能工作） ============ -->
<script>
(function () {
  'use strict';
  var VERSION = '1.2.0';
  var APP = '计算器';
  var MAX_LOG = 200, MAX_ACT = 60, MAX_ERR = 20;
  var STORE_KEY = 'calc.diag.v1';
  var logs = [], acts = [], errs = [];
  var selfErrors = 0, inHook = false, t0 = Date.now();
  var prev = null, swState = '未注册', snapshotFn = null, saveTimer = null;

  function two(n) { return n < 10 ? '0' + n : '' + n; }
  function stamp(t) {
    var d = new Date(t);
    return two(d.getMonth() + 1) + '-' + two(d.getDate()) + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()) + ':' +
      two(d.getSeconds()) + '.' + ('00' + d.getMilliseconds()).slice(-3);
  }
  function clip(s, n) { s = String(s); return s.length > n ? s.slice(0, n) + '…(+' + (s.length - n) + ')' : s; }
  function safeStr(x) {
    try {
      if (x instanceof Error) return (x.name || 'Error') + ': ' + x.message;
      if (typeof x === 'string') return x;
      if (x === undefined) return 'undefined';
      if (typeof x === 'object') { try { return JSON.stringify(x); } catch (e) { return Object.prototype.toString.call(x); } }
      return String(x);
    } catch (e) { return '[unprintable]'; }
  }
  function urlNoQuery(u) {
    try { var x = new URL(String(u), location.href); return x.origin + x.pathname; }
    catch (e) { return clip(String(u).split(/[?#]/)[0], 200); }
  }
  /* 脱敏：密钥/token/密码/cookie、邮箱、手机号、网址参数。keepNum=true 时保留数字（计算内容需要原样复现）。 */
  function redact(s, keepNum) {
    try {
      s = String(s);
      s = s.replace(/(api[_-]?key|access[_-]?token|token|secret|password|passwd|pwd|cookie|authorization|session)(["']?\s*[:=]\s*["']?)[^\s"'&,;]+/ig, '$1$2***');
      s = s.replace(/Bearer\s+[A-Za-z0-9._~+\/=-]+/g, 'Bearer ***');
      s = s.replace(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g, '***@***');
      s = s.replace(/\b(?=[A-Za-z0-9_-]*[A-Za-z])(?=[A-Za-z0-9_-]*\d)[A-Za-z0-9_-]{32,}\b/g, '***');
      s = s.replace(/(https?:\/\/[^\s?#]+)\?[^\s#]*/g, '$1?***');
      if (!keepNum) {
        s = s.replace(/\b1[3-9]\d{9}\b/g, '***phone***').replace(/\+?\d{2,4}[\s-]\d{3,4}[\s-]\d{3,4}/g, '***phone***');
      }
      return s;
    } catch (e) { return '[redact failed]'; }
  }

  function log(level, mod, msg, stack) {
    try {
      var keep = (mod === 'calc' || mod === 'ui');
      var e = { t: Date.now(), l: level, m: mod, s: clip(redact(typeof msg === 'string' ? msg : safeStr(msg), keep), 400) };
      logs.push(e); if (logs.length > MAX_LOG) logs.shift();
      if (level === 'ERROR') {
        errs.push({ t: e.t, m: mod, s: e.s, st: stack ? clip(redact(stack, keep), 1800) : '' });
        if (errs.length > MAX_ERR) errs.shift();
      }
      if (level !== 'INFO') scheduleSave();
    } catch (x) { selfErrors++; }
  }
  function action(text) {
    try { acts.push({ t: Date.now(), s: clip(redact(text, true), 80) }); if (acts.length > MAX_ACT) acts.shift(); }
    catch (x) { selfErrors++; }
  }

  /* ---- 跨会话保存（页面被系统杀掉后，下次还能看到上次的错误） ---- */
  function save() {
    try {
      var o = { v: VERSION, t: Date.now(), errs: errs.slice(-MAX_ERR), logs: logs.slice(-60) };
      var s = JSON.stringify(o);
      if (s.length > 30000) { o.logs = o.logs.slice(-20); s = JSON.stringify(o); }
      localStorage.setItem(STORE_KEY, s);
    } catch (e) { /* 存储不可用就算了 */ }
  }
  function scheduleSave() {
    try { if (saveTimer) return; saveTimer = setTimeout(function () { saveTimer = null; save(); }, 800); } catch (e) { selfErrors++; }
  }
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) prev = JSON.parse(raw); } catch (e) { prev = null; }

  /* ---- 全局错误捕获 ---- */
  try {
    window.addEventListener('error', function (ev) {
      try {
        var tgt = ev.target;
        if (tgt && tgt !== window && (tgt.src || tgt.href)) {
          log('ERROR', 'resource', '资源加载失败: ' + (tgt.tagName || '?') + ' ' + urlNoQuery(tgt.src || tgt.href));
          return;
        }
        var msg = ev.message || (ev.error && ev.error.message) || '未知错误';
        log('ERROR', 'window.onerror', msg + ' @ ' + urlNoQuery(ev.filename || '') + ':' + ev.lineno + ':' + ev.colno, ev.error && ev.error.stack);
      } catch (e) { selfErrors++; }
    }, true);
    window.addEventListener('unhandledrejection', function (ev) {
      try { log('ERROR', 'promise', '未处理的 Promise 异常: ' + safeStr(ev.reason), ev.reason && ev.reason.stack); } catch (e) { selfErrors++; }
    });
    window.addEventListener('online', function () { log('INFO', 'net', '网络已连接'); });
    window.addEventListener('offline', function () { log('WARN', 'net', '网络已断开'); });
    window.addEventListener('pagehide', save);
    document.addEventListener('visibilitychange', function () {
      log('INFO', 'app', '页面' + (document.hidden ? '进入后台' : '回到前台'));
      if (document.hidden) save();
    });
    document.addEventListener('securitypolicyviolation', function (ev) {
      log('ERROR', 'csp', '安全策略拦截: ' + ev.violatedDirective + ' ' + urlNoQuery(ev.blockedURI || ''));
    });
  } catch (e) { selfErrors++; }

  /* ---- console.error / console.warn ---- */
  try {
    ['error', 'warn'].forEach(function (name) {
      var orig = console[name];
      console[name] = function () {
        try {
          if (!inHook) {
            inHook = true;
            var parts = [], stack = '';
            for (var i = 0; i < arguments.length; i++) {
              parts.push(safeStr(arguments[i]));
              if (!stack && arguments[i] instanceof Error) stack = arguments[i].stack || '';
            }
            log(name === 'error' ? 'ERROR' : 'WARN', 'console', parts.join(' '), stack);
          }
        } catch (e) { selfErrors++; } finally { inHook = false; }
        try { return orig.apply(console, arguments); } catch (e) { /* ignore */ }
      };
    });
  } catch (e) { selfErrors++; }

  /* ---- fetch / XHR（只记录地址、状态码、耗时；不记录内容） ---- */
  try {
    if (window.fetch) {
      var origFetch = window.fetch;
      window.fetch = function (input, init) {
        var url = '?', method = 'GET', t = Date.now();
        try {
          url = urlNoQuery(typeof input === 'string' ? input : (input && input.url) || '');
          method = (init && init.method) || (input && input.method) || 'GET';
          log('INFO', 'net', 'fetch 开始 ' + method + ' ' + url);
        } catch (e) { selfErrors++; }

    out.push('历史条数: ' + history.length + '（无备注的上限 ' + HMAX + '，总上限 ' + HHARD + '）· 带备注: ' + noteCount() + ' 条（内容不写入报告）');
    out.push('当前结果可加备注: ' + (notebar.hidden ? '否' : '是') + ' · 备注条: ' + (notebar.hidden ? '隐藏' : (findById(curId) && findById(curId).n ? '已有备注' : '无备注')));
    out.push('按键音设置: ' + (settings.sound ? '开' : '关') + ' · 音频状态: ' + (Sound.failed ? '不可用' : Sound.ctx ? Sound.ctx.state : '未启动') +
      ' · 震动设置: ' + (settings.haptic ? '开' : '关') + ' · 震动方式: ' + Haptic.mode);
    out.push('算式显示: 字号 ' + (mainEl.style.fontSize || '默认') + ' · 内容高度 ' + mainEl.scrollHeight + '/可视 ' + mainEl.clientHeight + ' · 滚动兜底: ' + (mainEl.classList.contains('crush') ? '是' : '否'));
    out.push('最近 5 条历史: ' + (history.slice(0, 5).map(function (h) { return h.e + '=' + h.r + (h.n ? '[有备注]' : ''); }).join(' ; ') || '(无)'));
    return out;
  });

  /* 离线缓存 */
  function registerSW() {
    try {
      if (!('serviceWorker' in navigator)) { Diag.setSW('浏览器不支持或非 https'); Diag.log('WARN', 'sw', '不支持 Service Worker（需要 https 网址）'); return; }
      var hadController = !!navigator.serviceWorker.controller, reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        try {
          if (!hadController || reloading) return;       // 第一次安装不算更新
          Diag.log('INFO', 'sw', '检测到新版本，已接管');
          if (st.expr === '' && !anySheetOpen()) { reloading = true; location.reload(); }
          else Diag.toast('已有新版本，下次打开生效');
        } catch (e) { Diag.log('ERROR', 'sw', '处理新版本时异常: ' + e, e && e.stack); }
      });
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        Diag.setSW('已注册 scope=' + reg.scope); Diag.log('INFO', 'sw', '离线缓存已注册 ' + reg.scope);
      }, function (e) { Diag.setSW('注册失败: ' + e); Diag.log('WARN', 'sw', '离线缓存注册失败: ' + e); });
    } catch (e) { Diag.log('ERROR', 'sw', '注册离线缓存时异常: ' + e, e && e.stack); }
  }

  loadSettings();
  Haptic.init();
  loadHistory();
  Diag.log('INFO', 'app', '设置: 按键音=' + settings.sound + ' 震动=' + settings.haptic + ' 震动方式=' + Haptic.mode);
  render();
  window.addEventListener('load', function () {
    registerSW();
    Diag.log('INFO', 'app', '页面加载完成，耗时 ' + Math.round(performance.now()) + 'ms');
  });
  window.__calc = { Engine: Engine, Input: Input };   // 仅供自测使用
  Diag.log('INFO', 'app', '计算器启动 v' + Diag.VERSION);
})();
</script>
